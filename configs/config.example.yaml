# configs/myconfig.yaml
# Camera Configuration Schema for RAW -> DNG -> JPG Pipeline
# All paths can be absolute or relative to the config file directory.

paths:

  input_manifest_root: string
  
  setup_exiftool_script: string (optional)
  # Root of the agir-pipeline repository on the SciNet system
  agir_pipeline_dir: string

  # Camera config YAML passed to raw_to_jpg --c
  stage_config: string

  # Where staged RAW inputs land after transfer (one subdir per batch_id)
  input_staging_root: string

  # Where per-run artifacts (run_report.json, manifest.json) are saved after the job
  output_stage_runs: string

  # Root under which final promoted JPGs are written as:
  #   <final_dest_root>/<batch_id>/images/<image_id>.jpg
  final_dest_root: string

  # SLURM job stdout/stderr logs
  log_dir: string

  # Path to RawTherapee CLI executable
  rawtherapee_cli: string

  # Directory for temporary DNG files
  temp_dng_dir: string

  # Path to color matrix numpy file (.npy)
  color_matrix: string

  # Path to SVS tags configuration file (.yaml)
  svs_tags: string

  # Path to RawTherapee PP3 processing profile
  pp3_profile: string

  # Optional validation script path
  rawtherapee_validate_script: string (optional)

base_imgsz: 3840
scales: [0.15, 0.25, 0.5, 1.0, 1.25, 1.5]

# Per-scale thresholds (lenient — let WBF handle fusion)
per_scale_conf: 0.0
per_scale_iou: 1.0
per_scale_max_det: 2000

# Final thresholds (strict)
conf: 0.70
iou: 0.55
final_max_det: 2000

# Weighted box fusion
wbf_iou: 0.55
wbf_score_thr: 0.001

# Edge-aware filtering (optional)
edge_aware:
  enabled: true
  edge_band_rel: 0.08
  min_factor: 0.60
  taper_rel: 0.20

# Post-fusion NMS (optional)
post_fusion_nms:
  enabled: true
  iou: 0.6


# ── Globus transfer settings ──────────────────────────────────────────────────
transfer:
  juno_endpoint: string
  ncsu_endpoint: string
  ceres_endpoint: string

  # Set to "production" to use JUNO as the source.
  # Set to "testing_ncsu" to use the NCSU test endpoint.
  source_mode: production

  # Set to false to submit real Globus transfers.
  dry_run: false

  poll_interval_seconds: 30
  poll_timeout_seconds: 7200    # 2 hours
  max_poll_attempts: 240

  routes:
    raw_to_jpg:
      data_state: string
      source_root_juno: string
      source_root_ncsu: string
      destination_root: string

# ── SLURM job parameters ──────────────────────────────────────────────────────
slurm:
  account: string
  cpus_per_task: int
  mem: string
  time: string

# configs/config.yaml defines the stages to run and how to run them. The "cli_args" field is a template string that can reference any of the config fields defined above, as well as the following special variables that are filled in by find:
stage:
  name: raw_to_jpg
  cli_module: stages.raw_to_jpg.cli
  cli_args: >-
    --c $CONFIG_PATH
    --i $TMPDIR/input
    --o $TMPDIR/output
    --t $CPUS
    --batch-id $BATCH_ID
    --window-key $WINDOW_KEY
  output_subdir: raw_to_jpg
  promote_script: stages/raw_to_jpg/promote.py
  promote_args: "--run-dir $RUN_DIR --dest $FINAL_DEST"