# configs/myconfig.yaml
# Camera Configuration Schema for RAW -> DNG -> JPG Pipeline
# All paths can be absolute or relative to the config file directory.

paths:

  db: /90daydata/dash_agir/semifield-tools/pipeline_registry.db

  uv_env: /project/dash_agir/matthew.kutugata/software/uv/venvs/agir_pipeline/bin/activate

  locks_root: /90daydata/dash_agir/locks

  input_manifest_root: /90daydata/dash_agir/semifield-input-manifests
  
  # Root of the agir-pipeline repository on the SciNet system
  agir_pipeline_dir: /project/dash_agir/matthew.kutugata/repos/agir-pipeline

  # Camera config YAML passed to raw_to_jpg --c
  stage_config: /project/dash_agir/matthew.kutugata/repos/agir-pipeline/configs/jpg_to_det.yaml

  # Where staged RAW inputs land after transfer (one subdir per batch_id)
  input_staging_root: /90daydata/dash_agir/semifield-developed-images

  # Where per-run artifacts (run_report.json, manifest.json) are saved after the job
  output_stage_runs: /90daydata/dash_agir/tmp/stage_runs

  # Root under which final promoted JPGs are written as:
  #   <final_dest_root>/<batch_id>/images/<image_id>.jpg
  final_dest_root: /90daydata/dash_agir/semifield-developed-images

  # SLURM job stdout/stderr logs
  log_dir: /project/dash_agir/logs/jpg_to_det

  # detection model path
  det_model_path: /90daydata/dash_agir/semifield-tools/models/plant_detector/With_Synthetic_Train_Data/weights/last.pt

base_imgsz: 3840
scales: [0.15, 0.25, 0.5, 1.0, 1.25, 1.5]

# Per-scale thresholds (lenient — let WBF handle fusion)
per_scale_conf: 0.0
per_scale_iou: 1.0
per_scale_max_det: 2000

# Final thresholds (strict)
conf: 0.70
iou: 0.55
final_max_det: 2000

# Weighted box fusion
wbf_iou: 0.55
wbf_score_thr: 0.001

# Edge-aware filtering (optional)
edge_aware:
  enabled: true
  edge_band_rel: 0.08
  min_factor: 0.60
  taper_rel: 0.20

# Post-fusion NMS (optional)
post_fusion_nms:
  enabled: true
  iou: 0.6


# ── Globus transfer settings ──────────────────────────────────────────────────
transfer:
  juno_endpoint: "904c2108-90cf-11e8-9672-0a6d4e044368"
  ncsu_endpoint: "2f7f6170-8d5c-11e9-8e6a-029d279f7e24"
  ceres_endpoint: "f45a24f8-09ba-11ec-b342-1feaf93e3729"
  atlas_endpoint: "c8ce33a1-0ec3-4aaa-b93a-c8ce0b5f8ad7"

  # Set to "production" to use JUNO as the source.
  # Set to "testing_ncsu" to use the NCSU test endpoint.
  source_mode: production

  # Set to false to submit real Globus transfers.
  dry_run: false

  poll_interval_seconds: 30
  poll_timeout_seconds: 7200    # 2 hours
  max_poll_attempts: 240

  routes:
    jpg_to_det:                               # must match stage.name
      source_root_juno: /LTS/project/dash_agir/semifield-developed-images
      destination_root: /90daydata/dash_agir/semifield-developed-images


# ── SLURM job parameters ──────────────────────────────────────────────────────
slurm:
  account: dash_agir
  partition: gpu-a100
  gres: gpu:1
  cpus_per_task: 16
  mem: 128G
  time: "4:00:00"
  det_workers: 4      # --t argument: parallel worker processes for detection

# configs/config.yaml defines the stages to run and how to run them. The "cli_args" field is a template string that can reference any of the config fields defined above, as well as the following special variables that are filled in by find:
stage:
  name: jpg_to_det
  cli_module: stages.jpg_to_det.cli
  cli_args: >-
    --c $CONFIG_PATH
    --i $TMPDIR/input
    --o $TMPDIR/output
    --t $CPUS
    --batch-id $BATCH_ID
    --window-key $WINDOW_KEY
  output_subdir: jpg_to_det
  promote_script: stages/jpg_to_det/promote.py
  promote_args: "--run-dir $RUN_DIR --dest $FINAL_DEST"