[project]
name = "agir-pipeline"
version = "1.2.0"
description = "AgIR pipeline"
license = { text = "MIT" }
requires-python = ">=3.12"

# Core pipeline dependencies.
dependencies = [
  "pycolmap",
  "pyyaml>=6.0",
  "pidng>=4.0.9",
  "pytz>=2026.2",
  "opencv-python>=4.13.0.92",
  "jinja2>=3.1.0",
  "tqdm>=4.70",
  "pandas>=3.0.5",
  "geopandas>=1.1.4",
  "packaging>=26.3",
  "pyogrio>=0.13.0",
  "pyproj>=3.7.2",
  "shapely>=2.1.2",
]

[project.optional-dependencies]
# -----------------------------
# Developer tooling
# -----------------------------
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "black>=23.7.0",
  "isort>=5.12.0",
  "flake8>=6.1.0",
  "mypy>=1.5.0",
  "ipython>=8.14.0",
  "ipdb>=0.13.13",
]

# -----------------------------
# CV / imaging + ML stack
# -----------------------------
cv = [
  "numpy>=1.24.0",
  "pidng>=4.0.9",
  "pillow>=10.0.0",
  "scipy>=1.11.0",
  "scikit-image>=0.21.0",
  "opencv-python>=4.8.0",
  "pytz>=2023.3",
  "geopandas>=0.14.0",
  "packaging>=23.0",
]

ml = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ultralytics>=8.0.0",
  "segmentation-models-pytorch>=0.3.0",
  "timm>=0.9.0",
]

# Everything (dev + docs + cv + ml + hpc)
all = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "black>=23.7.0",
  "isort>=5.12.0",
  "flake8>=6.1.0",
  "mypy>=1.5.0",
  "ipython>=8.14.0",
  "ipdb>=0.13.13",
  "numpy>=1.24.0",
  "pidng>=4.0.9",
  "pillow>=10.0.0",
  "scipy>=1.11.0",
  "scikit-image>=0.21.0",
  "opencv-python>=4.8.0",
  "pytz>=2023.3",
  "geopandas>=0.14.0",
  "packaging>=23.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ultralytics>=8.0.0",
  "segmentation-models-pytorch>=0.3.0",
  "timm>=0.9.0",
  "omegaconf",
]

# =============================================================================
# BUILD SYSTEM
# =============================================================================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
"stages" = "stages"
"stages.common" = "stages/common"
"stages.det_to_world" = "stages/det_to_world"
"stages.jpg_to_det" = "stages/jpg_to_det"
"stages.det_to_seg" = "stages/det_to_seg"
"stages.raw_to_jpg" = "stages/raw_to_jpg"
"orchestrator" = "orchestrator"

[tool.setuptools]
packages = [
    "stages",
    "stages.common",
    "stages.det_to_world",
    "stages.jpg_to_det",
    "stages.det_to_seg",
    "stages.raw_to_jpg",
    "orchestrator"
]

[tool.setuptools.package-data]
orchestrator = ["templates/*.j2"]

# =============================================================================
# CODE FORMATTING & LINTING
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | squashfs-root
  | RawTherapee_.*
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/RawTherapee_*", "*/squashfs-root/*"]
